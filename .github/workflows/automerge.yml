name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  # fetch-metadata reads the PR's commits
  pull-requests: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # npm updates need a manual security review (see npm-security.yml).
    if: ${{ github.actor == 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/') }}
    steps:
      # Majors need a manual review (#2808); update-type is the highest change in the PR.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # The pin check is taken from the base commit, so a PR cannot change its own check.
      - name: Check out the pin check from the base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: utils/check_sodar_core_pins.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # SODAR Core and everything it requires (Django, djangorestframework, ...) are only ever
      # upgraded by hand (#2806, #2835), also when another update changes them indirectly.
      - name: Skip PRs that change SODAR Core or its requirements
        id: protected
        shell: bash
        run: |
          lock() {
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$REPO/contents/backend/Pipfile.lock?ref=$1"
          }
          lock "$BASE_SHA" > "$RUNNER_TEMP/base.lock"
          lock "$HEAD_SHA" > "$RUNNER_TEMP/head.lock"
          # Any non-zero exit (pinned package changed, PyPI or API error) keeps auto-merge off.
          if ! changed=$(python3 utils/check_sodar_core_pins.py \
              "$RUNNER_TEMP/base.lock" "$RUNNER_TEMP/head.lock" 2>&1); then
            echo "::warning::Not enabling auto-merge: $(echo "$changed" | tr '\n' ';')"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PRs
        if: >-
          ${{ steps.protected.outputs.skip != 'true' &&
              (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
               steps.metadata.outputs.update-type == 'version-update:semver-minor') }}
        # Only the head commit checked above may be merged.
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # GitHub provides this variable in the CI env. You don't
          # need to add anything to the secrets vault.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
