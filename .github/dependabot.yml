# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# Minor/patch and security updates come as one PR per ecosystem; majors stay separate.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Django and SODAR Core are only ever upgraded by hand (#2776, #2806).
    ignore:
      - dependency-name: "django"
      - dependency-name: "django-sodar-core"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["minor", "patch"]

  # npm: only versions published for at least 7 days (supply chain attacks such as
  # Shai-Hulud); never auto-merged, see automerge.yml.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["minor", "patch"]
