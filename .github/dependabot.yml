# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# Minor/patch and security updates come as one PR per ecosystem; majors stay separate.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Django and SODAR Core are only ever upgraded by hand (#2776, #2806).
    ignore:
      - dependency-name: "django"
      - dependency-name: "django-sodar-core"
      # Only patch updates: a "minor" step is breaking for these 0.x and coupled packages (#2811).
      - dependency-name: "sqlparse"  # #2779
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "vcfpy"  # #2779
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "django-postgres-copy"  # #2779
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "grpcio-tools"  # #2810
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "protobuf"  # #2810
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["minor", "patch"]

  # npm: only versions published for at least 7 days (supply chain attacks such as
  # Shai-Hulud); never auto-merged, see automerge.yml.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Only patch updates: generator and runtime client must be upgraded together and the
      # API clients regenerated (#2781, #2814).
      - dependency-name: "@hey-api/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["minor", "patch"]
