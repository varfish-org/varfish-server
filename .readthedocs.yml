version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  # pg_config for building psycopg2
  apt_packages:
    - libpq-dev

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py

formats:
  - pdf
  - epub

python:
   install:
     - requirements: docs/requirements.txt
